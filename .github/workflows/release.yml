name: Release App

on:
  push:
    tags:
      - 'v*' # S'exécute uniquement lorsqu'un tag commençant par 'v' est poussé (ex: v1.0.0)

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write # Nécessaire pour permettre au robot de créer une release sur le dépôt

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci # Installation propre à partir du package-lock.json

      - name: Build and Publish Release
        run: npm run electron:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Jeton de sécurité fourni automatiquement par GitHub
